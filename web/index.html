<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>IceValue – Hockey Card Prices</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0B3C5D;
      color: white;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      color: black;
      padding: 30px;
      border-radius: 12px;
    }
    h1 { text-align: center; margin-top: 0; }
    button {
      width: 100%;
      padding: 12px;
      background: #0B3C5D;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin: 12px 0;
      box-sizing: border-box;
    }
    .result {
      margin-top: 20px;
      font-size: 14px;
      background: #f0f0f0;
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    .lang { text-align: center; margin-bottom: 15px; }
    .hint { text-align:center; margin: 0 0 10px 0; opacity: 0.8; }
  </style>
</head>

<body>
  <div class="container">
    <div class="lang">🇨🇦 Français / 🇺🇸 English</div>

    <h1>IceValue</h1>
    <p class="hint">
      Valeur estimée des cartes de hockey<br>
      Estimated hockey card values
    </p>

    <input id="q" placeholder="Ex: Connor McDavid Young Guns PSA 10" />
    <button onclick="searchCard()">Rechercher / Search</button>

    <button onclick="checkApi()">Tester la connexion à l’API</button>

    <div id="result" class="result"></div>
  </div>

  <script>
    const API_BASE = "https://icevalue-api.onrender.com";

    function checkApi() {
      const resultEl = document.getElementById("result");
      resultEl.innerText = "Connexion en cours...";

      fetch(API_BASE + "/")
        .then(async (res) => {
          const text = await res.text();
          resultEl.innerText = "Réponse API:\n\n" + text;
        })
        .catch((err) => {
          resultEl.innerText = "Erreur: " + (err?.message || "connexion impossible");
        });
    }

    function searchCard() {
      const q = document.getElementById("q").value.trim();
      const resultEl = document.getElementById("result");

      if (!q) {
        resultEl.innerText = "Entre un nom de carte / Enter a card name";
        return;
      }

      resultEl.innerText = "Recherche en cours... / Searching...";

      fetch(API_BASE + "/search?q=" + encodeURIComponent(q))
        .then(res => res.json())
        .then(data => {
          resultEl.innerText = JSON.stringify(data, null, 2);
        })
        .catch(err => {
          resultEl.innerText = "Erreur: " + (err?.message || "connexion impossible");
        });
    }
  </script>
</body>
</html>
